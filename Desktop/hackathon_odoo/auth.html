<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FleetFlow | Authentication</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/theme.css">
</head>

<body class="auth">

  <div class="auth-container">

    <!-- LOGIN -->
    <form id="loginForm" class="login-box card">
      <h2>Login</h2>

      <input id="loginUser" placeholder="Username" required>
      <input id="loginPass" type="password" placeholder="Password" required>

      <button type="submit" class="btn btn-primary">
        Login
      </button>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="signup-box card">
      <h2>Register</h2>

      <input id="regName" placeholder="Name" required>
      <input id="regEmail" type="email" placeholder="Email" required>
      <input id="regPass" type="password" placeholder="Password" required>

      <button type="submit" class="btn btn-primary">
        Register
      </button>
    </form>

  </div>

  <!-- JS -->
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
