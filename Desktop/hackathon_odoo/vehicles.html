  <div class="page">
    <h2>Vehicle Registry</h2>

    <form id="vehicleForm" class="card">
      <input id="plate" placeholder="License Plate" required>
      <input id="capacity" type="number" placeholder="Capacity (kg)" required>

        Add Vehicle
      </button>
    </form>

    <table id="vehicleTable">
      <thead>
        <tr>
          <th>License Plate</th>
          <th>Capacity</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <!-- Filled by JS -->
      </tbody>
    </table>
