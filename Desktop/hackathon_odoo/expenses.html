<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FleetFlow | Expenses</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/theme.css">
</head>

<body>

  <!-- AUTH GUARD -->
  <script src="js/router.js"></script>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <a href="dashboard.html">Dashboard</a>
    <a href="vehicles.html">Vehicle Registry</a>
    <a href="trips.html">Trip Dispatcher</a>
    <a href="maintenance.html">Maintenance</a>
    <a href="expenses.html" class="active">Expenses</a>
    <a href="drivers.html">Drivers</a>
    <a href="analytics.html">Analytics</a>
  </div>

  <!-- PAGE CONTENT -->
  <div class="page">
    <h2>Expense & Fuel Logs</h2>

    <form id="expenseForm" class="card">
      <input id="tripId" placeholder="Trip ID" required>
      <input id="fuelCost" type="number" placeholder="Fuel Cost (₹)" required>
      <input id="miscCost" type="number" placeholder="Misc Cost (₹)" value="0">
      <button class="btn btn-primary" type="submit">
        Add Expense
      </button>
    </form>

    <table id="expenseTable">
      <thead>
        <tr>
          <th>Trip ID</th>
          <th>Fuel</th>
          <th>Misc</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        <!-- Filled by JS -->
      </tbody>
    </table>
  </div>

  <!-- JS -->
  <script src="js/app.js"></script>
  <script src="js/expenses.js"></script>

</body>
</html>
