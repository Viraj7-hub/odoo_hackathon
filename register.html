<!DOCTYPE html>
<html>
<head>
<title>Register - FleetFlow</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="hero">
<h1>Create Enterprise Account</h1>

<div class="card" style="max-width:500px;margin:auto;">

<input type="text" id="fullName" placeholder="Full Name">
<input type="email" id="regEmail" placeholder="Work Email">
<input type="password" id="regPassword" placeholder="Password">
<input type="password" id="confirmPassword" placeholder="Confirm Password">

<select id="role">
<option value="">Select Role</option>
<option value="Fleet Manager">Fleet Manager</option>
<option value="Dispatcher">Dispatcher</option>
<option value="Safety Officer">Safety Officer</option>
<option value="Financial Analyst">Financial Analyst</option>
</select>

<label style="display:block;margin:10px 0;">
<input type="checkbox" id="terms"> I accept Terms & Conditions
</label>

<button class="btn" onclick="register()">Register</button>

<p>Already have account? <a href="login.html">Login</a></p>

</div>
</div>

<script src="auth.js"></script>
</body>
</html>
